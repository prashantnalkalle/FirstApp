<div class="container mt-5">
  <div class="row">
    <div class="col-md-12">
      <p class="alert alert-primary">
        {{str()}}
      </p>

    </div>

  </div>
  <button class="btn  btn-sm btn-primary" (click)="setvalue()">Submit</button>
</div>



<div class="container">
  <div class="row justify-content-center py-4">
    @if(postArr){
       @for (post of postArr; track post.id) {
      <div class="col-md-6 my-4">
        <div class="card h-100">
          <div class="card-header">
            <h5 class="card-title">{{ post.title }}</h5>
          </div>
          <div class="card-body">
            <p class="card-text">{{ post.body }}</p>
            <small class="text-muted">Post ID: {{ post.id }} | User ID: {{ post.userId }}</small>
          </div>
          <div class="card-footer d-flex justify-content-between">
            <button class="btn btn-sm btn-danger">Edit</button>
            <button class="btn btn-sm btn-primary">Remove</button>
          </div>
        </div>
      </div>
    } 
    }
   
  </div>
</div>
